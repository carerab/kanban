<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カード利用明細デモ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#333}
.header{background:#fff;padding:16px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center}
.menu{width:52px;height:52px;background:#0070ce;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px}
.logo{color:#0070ce;font-weight:bold;font-size:22px;line-height:1}
.search{color:#0070ce;font-size:38px}
.logout{color:#0070ce;font-size:20px;font-weight:600;cursor:pointer}
.selector{margin-top:18px;display:flex;gap:12px;position:relative}
.select{flex:1;background:white;border:1px solid #ccc;border-radius:8px;padding:14px;font-size:18px;cursor:pointer}
.cardbox{width:130px;background:white;border:1px solid #ccc;border-radius:8px;padding:14px;text-align:center;font-size:18px}
.container{padding:16px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.dropdown{border:1px solid #ccc;border-radius:10px;padding:14px;color:#0070ce;font-size:18px;cursor:pointer}
.dropdown-panel{position:absolute;top:70px;left:0;right:65px;background:white;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20}
.dropdown-panel a{display:block;color:#0070ce;font-size:22px;padding:16px;text-decoration:underline}
.dropdown-panel .past{color:#888;text-decoration:none;font-weight:bold}
.dropdown-panel .active{border:2px solid #0070ce;border-radius:12px}
.dropdown-panel .past-item{background:#eaf3fb;border-radius:12px;margin:12px 0}
.credit-card{width:86px;height:54px;background:#111;border-radius:8px;margin-bottom:12px}
.product{font-size:28px;line-height:1.3;margin-bottom:8px;font-weight:700}
.last4{color:#666;margin-bottom:20px;font-size:20px}
.row{display:flex;justify-content:space-between;padding:18px 0;border-top:1px solid #eee;font-size:20px}
.amount{font-size:28px;font-weight:bold}
.link{color:#0070ce;font-weight:bold;padding-top:18px;border-top:1px solid #eee}
.section-title{font-size:32px;font-weight:bold;margin-bottom:8px}
.period{color:#666;margin-bottom:20px;font-size:18px}
.actions{display:flex;gap:30px;color:#0070ce;font-weight:bold;margin-bottom:16px;font-size:20px}
.filters{display:flex;gap:8px;margin-bottom:16px}
.filter{border:1px solid #ccc;border-radius:8px;padding:12px;background:white;color:#0070ce;font-weight:bold}
.transaction{display:grid;grid-template-columns:54px 1fr 105px;gap:10px;padding:18px 0;border-top:1px solid #eee;align-items:center}
.date{font-weight:bold;font-size:22px}
.shop{color:#0070ce;font-weight:bold;font-size:22px;line-height:1.35}
.price{text-align:right;font-weight:bold;font-size:22px}
.green{color:#00894c}
.feedback{position:fixed;right:0;top:70%;background:#00856f;color:white;padding:14px 8px;writing-mode:vertical-rl;border-radius:6px 0 0 6px}
.detail-amount{font-size:64px;font-weight:bold;margin:40px 0}
.detail-text{font-size:22px;line-height:1.8;margin-bottom:30px}
.darkblue{color:#001f6b}
.backbtn{width:100%;background:#0070ce;color:white;border:0;border-radius:10px;padding:16px;font-size:18px;margin-top:40px}
.notice{border:1px solid #ddd;border-radius:16px;padding:22px;line-height:1.8;font-size:20px;margin-bottom:24px}
.tab-on{background:#0070ce;color:white;padding:18px;text-align:center;border-radius:12px 12px 0 0;font-weight:bold;font-size:20px}
.tab-off{background:#eef3f8;padding:18px;text-align:center;border-radius:0 0 12px 12px;font-weight:bold;font-size:20px}
.login-card{background:white;margin:24px 16px;padding:26px}
.input{width:100%;height:58px;border:1px solid #0070ce;border-radius:6px;margin:14px 0 28px;font-size:20px;padding:10px}
.login-btn{width:100%;background:#0070ce;color:white;border:0;border-radius:6px;padding:18px;font-size:22px;margin-top:20px}
.success{margin:20px 16px;background:#fff;border:2px solid #00856f;color:#00856f;padding:24px;font-size:22px;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<div class="feedback">Feedback</div>

<script>
let dropOpen=false;

function header(login=false){
return `
<div class="header">
  <div class="top">
    <div class="menu">☰</div>
    <div class="logo">AMERICAN<br>EXPRESS</div>
    <div class="search">⌕</div>
    <div class="logout" onclick="${login?'showList()':'showLogout()'}">${login?'ログイン':'ログアウト'}</div>
  </div>
  ${login?'':`
  <div class="selector">
    <div class="select" onclick="toggleDrop()">お選びください ${dropOpen?'⌃':'⌄'}</div>
    <div class="cardbox">••••41006</div>
    ${dropOpen?dropdown():''}
  </div>`}
</div>`;
}

function dropdown(){
return `
<div class="dropdown-panel">
  <a>🔍 絞り込み検索</a>
  <a class="active">直近のご利用分 ✓</a>
  <a class="past">過去のご利用分</a>
  <a class="past-item">2026/04/20 - 2026/05/19</a>
  <a>2026/03/20 - 2026/04/19</a>
  <a>2026/02/20 - 2026/03/19</a>
</div>`;
}

function toggleDrop(){dropOpen=!dropOpen;showList();}

function tx(date, shop, price){
return `<div class="transaction"><div class="date">${date}</div><div class="shop">${shop}</div><div class="price">${price} 〉</div></div>`;
}

function showList(){
document.getElementById("app").innerHTML = header() + `
<div class="container">

<div class="card">
  <b>ご利用履歴:</b>
  <div class="dropdown" onclick="toggleDrop()">直近のご利用分 ${dropOpen?'⌃':'⌄'}</div>
</div>

<div class="card">
  <div class="credit-card"></div>
  <div class="product">MARRIOTT BONVOY<br>アメリカン・エキスプレス・プレミアム・カード</div>
  <div class="last4">••••41006</div>
  <div class="row"><span>今回締め日時点ご利用金額</span><span class="amount">¥249,215</span></div>
  <div class="row"><span>新規ご利用金額</span><span class="amount">¥140,041</span></div>
</div>

<div class="card">
  <div class="section-title">最近のご利用</div>
  <div class="period">2026/05/20〜今日現在（次回締め日 2026/06/19）</div>
  <div class="actions"><span>↓ ダウンロード</span><span>🖨 印刷</span></div>
  <div class="filters"><div class="filter">すべての利用</div><div class="filter">区分 ▼</div><div class="filter">ご利用分 ▼</div></div>

  ${tx("06/16","GENKIZUS HI HONBU","¥1,309")}
  ${tx("06/15","COINPARK AIPOSS","¥600")}
  ${tx("06/15","DRUGSTORE SQUARE","¥720")}
  ${tx("06/15","セブンイレブン","¥1,296")}
  ${tx("06/15","名古屋駅前こころのクリニック 愛知県","¥1,510")}
  <div class="transaction" onclick="showHotelDetail()"><div class="date">06/06</div><div class="shop">名古屋東急ホテル ー愛知県 名古屋市</div><div class="price">¥24,700 〉</div></div>
  ${tx("06/06","スターバックス コーヒー ジャパン 東","¥1,000")}
  ${tx("06/06","ＤＣＭ","¥519")}
  ${tx("06/04","STAR CLUSTER PTE. LTD.","¥1,654")}
  ${tx("06/03","アマゾン JP マーケットプレイス","¥3,235")}
  ${tx("06/02","ナポリの窯 ストロベリーコーンズ 愛知","¥2,400")}
  ${tx("06/01","セブンイレブン","¥393")}
  ${tx("05/31","ＥＴＣ 名古屋高速道路公社","¥860")}
</div>

<div class="card">
  <h2 style="font-size:30px;margin-bottom:24px;">ご利用合計金額</h2>
  <div class="row"><span>前回締め日金額</span><span>¥249,215</span></div>
  <div class="row"><span>お支払/調整金額</span><span class="green">-¥249,215</span></div>
  <div class="row"><span>新規ご利用金額</span><span>¥140,041</span></div>
  <div class="row"><strong>合計金額</strong><strong>¥140,041</strong></div>
</div>

<div class="card">
  <h2 style="font-size:28px;margin-bottom:24px;">リボ払い・分割払い登録内容</h2>
  <div class="row"><span>リボ払い・分割払いご利用可能枠</span><span>¥800,000</span></div>
</div>

<div class="card">
  <div class="notice">ⓘ 登録状況等により、各項目が表示されない場合があります。請求内容については、カードご利用代金明細書をご確認ください。</div>
  <div style="font-size:22px;margin-bottom:20px;">ペイフレックス あとリボ　<strong>登録済（利用可能）</strong></div>
  <div class="tab-on">✓ リボ払いご利用状況</div>
  <div class="tab-off">リボ払いご利用履歴</div>
  <h3 style="font-size:24px;margin:34px 0 12px;">リボ払いご利用金額</h3>
  <div class="row"><span>リボ払い今回締め日金額</span><span>¥0</span></div>
  <div class="row"><span>リボ払いお支払い/調整金額</span><span>¥0</span></div>
  <div class="row"><span>現在のリボ払いご利用残高</span><span>¥0</span></div>
</div>

<div class="card"><h2 style="text-align:center;font-size:30px;">過去のご利用分</h2></div>

</div>`;
}

function showHotelDetail(){
document.getElementById("app").innerHTML = header() + `
<div class="container">
  <div class="card">
    <div class="transaction">
      <div class="date">06/06</div>
      <div class="shop">名古屋東急ホテル ー愛知県 名古屋市</div>
      <div class="price">¥24,700 ✕</div>
    </div>
    <div style="text-align:right;color:#0070ce;font-size:24px;margin-top:30px;">🖨 印刷</div>
    <div class="detail-amount">¥24,700</div>
    <div class="detail-text">2026/06/19 作成のご利用代金明細書に記載されています。</div>
    <hr>
    <div style="margin-top:35px;font-size:30px;font-weight:bold;" class="darkblue">📅 あと分割</div>
    <div style="margin-top:25px;font-size:22px;">あと分割とは：<span style="color:#0070ce;">詳細はこちら 〉</span></div>
    <div style="margin-top:30px;color:#0070ce;font-size:24px;font-weight:bold;">あと分割を利用する 〉</div>
    <div style="margin-top:60px;font-size:34px;font-weight:bold;" class="darkblue">NAGOYA TOKYU HOTEL</div>
    <button class="backbtn" onclick="showList()">明細一覧へ戻る</button>
  </div>
</div>`;
}

function showLogout(){
document.getElementById("app").innerHTML = header(true) + `
<div class="success">✓ アメリカン・エキスプレス オンライン・サービスからログアウトしました。</div>
<div class="login-card">
  <h1 style="text-align:center;margin-bottom:28px;font-size:30px;">マイアカウントにログイン</h1>
  <h2>ユーザーID</h2>
  <input class="input" disabled>
  <h2>パスワード</h2>
  <input class="input" disabled placeholder="表示">
  <div style="font-size:22px;margin:20px 0;">□ 次回からID入力を省略</div>
  <button class="login-btn" onclick="showList()">ログイン</button>
  <p style="color:#0070ce;font-size:20px;margin-top:28px;">ユーザーID・パスワードをお忘れの方</p>
  <p style="color:#0070ce;font-size:20px;margin-top:22px;">オンライン・サービス新規登録</p>
</div>`;
}

showList();
</script>
</body>
</html>
