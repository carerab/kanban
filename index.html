<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カード利用明細サンプル</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#333}
.header{background:#fff;padding:16px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center}
.menu{width:52px;height:52px;background:#0070ce;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px}
.logo{color:#0070ce;font-weight:bold;font-size:22px;line-height:1}
.search{color:#0070ce;font-size:38px}
.logout{color:#0070ce;font-size:20px;font-weight:600}
.selector{margin-top:18px;display:flex;gap:12px}
.select{flex:1;background:white;border:1px solid #ccc;border-radius:8px;padding:14px;font-size:18px}
.cardbox{width:130px;background:white;border:1px solid #ccc;border-radius:8px;padding:14px;text-align:center;font-size:18px}
.container{padding:16px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card-title{font-weight:bold;margin-bottom:12px}
.dropdown{border:1px solid #ccc;border-radius:10px;padding:14px;color:#0070ce;font-size:18px}
.credit-card{width:86px;height:54px;background:#111;border-radius:8px;margin-bottom:12px}
.product{font-size:28px;line-height:1.3;margin-bottom:8px;font-weight:700}
.last4{color:#666;margin-bottom:20px;font-size:20px}
.row{display:flex;justify-content:space-between;padding:18px 0;border-top:1px solid #eee}
.amount{font-size:28px;font-weight:bold}
.link{color:#0070ce;font-weight:bold;padding-top:18px;border-top:1px solid #eee}
.section-title{font-size:32px;font-weight:bold;margin-bottom:8px}
.period{color:#666;margin-bottom:20px;font-size:18px}
.actions{display:flex;gap:30px;color:#0070ce;font-weight:bold;margin-bottom:16px;font-size:20px}
.filters{display:flex;gap:8px;margin-bottom:16px}
.filter{border:1px solid #ccc;border-radius:8px;padding:12px;background:white;color:#0070ce;font-weight:bold}
.transaction{display:grid;grid-template-columns:54px 1fr 105px;gap:10px;padding:18px 0;border-top:1px solid #eee;align-items:center}
.date{font-weight:bold;font-size:22px}
.shop{color:#0070ce;font-weight:bold;font-size:22px;line-height:1.35}
.price{text-align:right;font-weight:bold;font-size:22px}
.green{color:#00894c}
.feedback{position:fixed;right:0;top:70%;background:#00856f;color:white;padding:14px 8px;writing-mode:vertical-rl;border-radius:6px 0 0 6px}
.detail-amount{font-size:64px;font-weight:bold;margin:40px 0}
.detail-text{font-size:22px;line-height:1.8;margin-bottom:30px}
.darkblue{color:#001f6b}
.backbtn{width:100%;background:#0070ce;color:white;border:0;border-radius:10px;padding:16px;font-size:18px;margin-top:40px}
</style>
</head>

<body>

<div id="app"></div>
<div class="feedback">Feedback</div>

    </div>

</div>`;

</script>

</body>
</html>
